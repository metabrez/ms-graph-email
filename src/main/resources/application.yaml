# Microsoft Graph API Configuration
azure:
  activedirectory:
    # Your Azure AD Application (client) ID
    client-id: Ebnter your client azure id

    # Your Azure AD Tenant (directory) ID
    tenant-id: Azure tenant id

    # Your Azure AD Client Secret Value (copied immediately after creation)
    client-secret: azure client secret

# Application-specific configuration
graph:
  sender-email: exampletest@outlook.com # IMPORTANT: Replace with the actual email address of the mailbox you want to send from

# --- SMTP Configuration (Required for Fallback) ---
spring:
  mail:
    host: smtp.your-email-provider.com # e.g., smtp.office365.com, smtp.gmail.com
    port: 587 # or 465 for SSL/TLS
    username: your-smtp-username # The sender's email address
    password: your-smtp-password # The sender's app-specific password or regular password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true # Use STARTTLS for secure connection
          connectiontimeout: 5000 # 5 seconds
          timeout: 5000
          writetimeout: 5000
